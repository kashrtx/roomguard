[package]
name = "roomguard"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["Kaushal Bhingaradia"]
license = "Apache-2.0"
description = "A camera based room alarm with faithful DSC PC1550 and PowerSeries PC1832 keypad replicas."
readme = "README.md"
build = "build.rs"

[dependencies]
eframe = "0.29"
cpal = "0.15"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
sha2 = "0.10"
ureq = "2.10"
open = "5"
qrcode = { version = "0.14", default-features = false }
starship-battery = "0.10"
self_replace = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
