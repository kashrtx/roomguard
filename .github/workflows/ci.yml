name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libudev-dev libv4l-dev \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Keep the lock file
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
