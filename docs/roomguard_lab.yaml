# RoomGuard Home Assistant Test Lab Package (LOCAL TESTING SANDBOX ONLY)
#
# Save this file inside your Home Assistant folder at:
#   /homeassistant/packages/roomguard_lab.yaml
#
# IMPORTANT: Keep the underscore (_) in "roomguard_lab.yaml".
# Home Assistant rejects hyphens (-) in package filenames.
#
# NO ALARM CODE IN THIS FILE:
# - The test panel below has no `code:` on purpose. RoomGuard's own keypad
#   already checks your real (salted and hashed) code before it disarms. If
#   this panel had a code too, disarming at RoomGuard would send your keypad
#   code to Home Assistant, Home Assistant would refuse it whenever the two
#   codes differ, and Two-Way sync would pull RoomGuard straight back to armed.
# - In RoomGuard, leave "HA panel PIN" blank for this test panel.
# - With a REAL wall panel (ESPHome Keybus / ECP or Envisalink), you don't use
#   this file either. Home Assistant forwards the code you type on RoomGuard's
#   keypad to the wall panel, and the wall panel checks it like a real keypad.
#   Never put a real alarm code in plain YAML.

input_boolean:
  roomguard_lab_door:
    name: Lab door open
    initial: false
  roomguard_lab_motion:
    name: Lab motion detected
    initial: false
  roomguard_lab_siren:
    name: Lab siren output
    initial: false

input_text:
  roomguard_test_bypasses:
    name: Lab bypassed zones (e.g. BY:1,BY:3)
    initial: ""

input_number:
  roomguard_lab_temperature:
    name: Lab temperature
    min: 0
    max: 60
    initial: 20
    step: 1
    unit_of_measurement: "°C"

template:
  - binary_sensor:
      - name: RoomGuard Test Door
        unique_id: roomguard_test_door
        default_entity_id: binary_sensor.roomguard_test_door
        device_class: door
        state: "{{ is_state('input_boolean.roomguard_lab_door', 'on') }}"
      - name: RoomGuard Test Motion
        unique_id: roomguard_test_motion
        default_entity_id: binary_sensor.roomguard_test_motion
        device_class: motion
        state: "{{ is_state('input_boolean.roomguard_lab_motion', 'on') }}"

alarm_control_panel:
  - platform: manual
    name: RoomGuard Test Panel
    unique_id: roomguard_test_panel
    code_arm_required: false
    # RoomGuard automatically measures and locks onto whatever arming_time / delay_time
    # your Home Assistant panel uses so both countdowns finish together in sync.
    arming_time: 15
    delay_time: 15
    trigger_time: 30
    arming_states:
      - armed_home
      - armed_away
      - armed_night
    disarmed:
      trigger_time: 0
